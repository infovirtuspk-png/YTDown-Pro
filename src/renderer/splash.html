<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YTDown Pro Loading</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background: transparent;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .splash-card {
            width: 440px;
            height: 320px;
            background: linear-gradient(145deg, #141824, #0b0d14);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            text-align: center;
            position: relative;
            padding: 24px;
        }
        .logo-box {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
        }
        .logo-box svg {
            width: 40px;
            height: 40px;
            fill: #ffffff;
        }
        .title {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 4px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .loader-ring {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-top: 24px;
        }
        .status-text {
            font-size: 12px;
            color: #64748b;
            margin-top: 12px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="splash-card">
        <div class="logo-box overflow-hidden" style="border-radius: 18px;">
            <img src="assets/icons/icon.png" alt="YTDown Pro Icon" style="width: 100%; height: 100%; object-fit: cover;">
        </div>
        <div class="title">YTDown Pro</div>
        <div class="subtitle">Fast • Simple • Powerful</div>
        <div class="loader-ring"></div>
        <div class="status-text" id="status">Initializing YTDown Pro Engine...</div>
    </div>
</body>
</html>
